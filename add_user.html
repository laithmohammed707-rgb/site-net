<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مستخدم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
        body{ background:#0a0a0f; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; padding: 20px; }
        .container{ width:100%; max-width:450px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(12px); padding:30px; border-radius:24px; box-shadow:0 20px 40px rgba(0,0,0,0.4); }
        h2{ text-align:center; margin-bottom:20px; font-size: 22px; }
        input, select { width:100%; padding:12px; margin-bottom:15px; border:none; outline:none; border-radius:10px; background:rgba(255,255,255,0.05); color:white; border:1px solid rgba(255,255,255,0.08); }
        select option { background: #1a1a2e; color: white; }
        
        .permissions-title { margin: 10px 0; font-weight: bold; color: #8b5cf6; border-bottom: 1px solid rgba(139, 92, 246, 0.3); padding-bottom: 5px; }
        .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 14px; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 8px; }
        .check-item input { width: auto; margin-bottom: 0; cursor: pointer; }
        
        button{ width:100%; padding:14px; border:none; border-radius:12px; cursor:pointer; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; font-size:16px; font-weight:bold; transition:0.3s; }
        button:hover{ transform:scale(1.02); box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
        .back{ display:block; text-align:center; margin-top:15px; color:#8b5cf6; text-decoration:none; font-size: 14px; }
        .alert{ padding:12px; border-radius:10px; margin-bottom:18px; text-align:center; font-size: 14px; }
        .danger{ background:rgba(239,68,68,0.15); color:#ef4444; }
        .success{ background:rgba(34,197,94,0.15); color:#22c55e; }
    </style>
</head>
<body>
    <div class="container">
        <h2>إضافة مستخدم جديد</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="email" name="email" placeholder="البريد الإلكتروني" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>

            <select name="center_type" required>
                <option value="" disabled selected>اختر نوع المركز</option>
                <option value="رئيسي">مركز رئيسي</option>
                <option value="فرعي">مركز فرعي</option>
            </select>

            <div class="permissions-title">صلاحيات النظام:</div>
            <div class="checkbox-group">
                <div class="check-item"><input type="checkbox" name="can_add_user"> <label>إضافة مستخدم</label></div>
                <div class="check-item"><input type="checkbox" name="can_transfer"> <label>التحويلات</label></div>
                <div class="check-item"><input type="checkbox" name="can_wallet_address"> <label>عنوان المحفظة</label></div>
                <div class="check-item"><input type="checkbox" name="can_view_users"> <label>المستخدمين</label></div>
                <div class="check-item"><input type="checkbox" name="can_financial_trans"> <label>تحويلات مالية</label></div>
                <div class="check-item"><input type="checkbox" name="can_active_wallet"> <label>المحفظة النشطة</label></div>
            </div>

            <button type="submit">إنشاء المستخدم</button>
        </form>
        <a class="back" href="{{ url_for('main.dashboard') }}">العودة للرئيسية</a>
    </div>
</body>
</html>
